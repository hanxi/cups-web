name: Build and Push Docker images

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push cups-web
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG_VER="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          IS_TAG="${{ github.ref_type == 'tag' && 'true' || 'false' }}"

          # AIO 镜像标签
          AIO_TAGS="ghcr.io/${REPO_LOWER}:${TAG_VER}"
          if [ "$IS_TAG" = "true" ]; then
            AIO_TAGS="${AIO_TAGS},ghcr.io/${REPO_LOWER}:latest"
          fi
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DH_USER=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            AIO_TAGS="${AIO_TAGS},${DH_USER}/cups-web:${TAG_VER}"
            if [ "$IS_TAG" = "true" ]; then
              AIO_TAGS="${AIO_TAGS},${DH_USER}/cups-web:latest"
            fi
          fi

          # 仅 Web 镜像标签
          WEB_TAGS="ghcr.io/${REPO_LOWER}:${TAG_VER}-web"
          if [ "$IS_TAG" = "true" ]; then
            WEB_TAGS="${WEB_TAGS},ghcr.io/${REPO_LOWER}:latest-web"
          fi
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DH_USER=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            WEB_TAGS="${WEB_TAGS},${DH_USER}/cups-web:${TAG_VER}-web"
            if [ "$IS_TAG" = "true" ]; then
              WEB_TAGS="${WEB_TAGS},${DH_USER}/cups-web:latest-web"
            fi
          fi

          echo "aio_tags=${AIO_TAGS}" >> "$GITHUB_OUTPUT"
          echo "web_tags=${WEB_TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_VER}" >> "$GITHUB_OUTPUT"

      - name: Build and push cups-web (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.aio_tags }}
          cache-from: type=gha,scope=cups-web
          cache-to: type=gha,scope=cups-web,mode=max

      - name: Build and push cups-web (Web only, multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          target: web-runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.web_tags }}
          cache-from: |
            type=gha,scope=cups-web
            type=gha,scope=cups-web-web
          cache-to: type=gha,scope=cups-web-web,mode=max

  output:
    name: Output pushed image refs
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Output pushed image refs
        run: |
          echo "Build and push completed successfully."
